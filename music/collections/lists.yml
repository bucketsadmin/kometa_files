##### Personal collections
#####
#############################################################################
external_templates:
  - repo: templates/collections.yml

collections:
  "📀Physical Media":
    summary: ""
    sort_title: "__+Physical Media"
    builder_level: album
    template:
      name: collection_not_visible
      poster: coll-vinyl
    plex_search:
      sort_by: album_artist.asc
      any:
        album_label:
          - "vinyl"
          - "cd"

  "Vinyl Collection":
    summary: "You spin me right round baby, right round"
    sort_title: "__+Physical Media: Vinyl"
    builder_level: album
    template:
      name: collection_not_visible
      poster: coll-vinyl
    plex_search:
      sort_by: album_artist.asc
      album_label:
        - "vinyl"

  "CD Collection":
    summary: "The future is now old man!"
    sort_title: "__+Physical Media: CD"
    builder_level: album
    template:
      name: collection_not_visible
      poster: coll-cd
    plex_search:
      sort_by: album_artist.asc
      album_label:
        - "cd"

  "Digital Media":
    summary: "Sometimes you just can't have all the physical toys"
    sort_title: "__+Digital Media"
    builder_level: album
    template:
      name: collection_not_visible
      poster: coll-cd
    plex_search:
      sort_by: album_artist.asc
      any:
        album_label:
          - "bandcamp"
          - "itunes"
          - "apple-music"

  "Bandcamp Collection":
    summary: "Supporting artists is what all the cool kids do"
    sort_title: "__+Digital Media: bandcamp"
    builder_level: album
    template:
      name: collection_not_visible
      poster: coll-bandcamp
    plex_search:
      sort_by: album_artist.asc
      album_label:
        - "bandcamp"

  "iTunes Collection":
    summary: ""
    sort_title: "__+Digital Media: itunes"
    builder_level: album
    template:
      name: collection_not_visible
      poster: coll-itunes
    plex_search:
      sort_by: album_artist.asc
      album_label:
        - "itunes"

  "Apple Music Collection":
    summary: "Supporting artists is what all the cool kids do"
    sort_title: "__+Digital Media: apple-music"
    builder_level: album
    template:
      name: collection_not_visible
      poster: coll-apple-music
    plex_search:
      sort_by: album_artist.asc
      album_label:
        - "apple-music"


  "Musicals":
    summary: ""
    builder_level: album
    template:
      name: collection_not_visible
      poster: coll-musicals
    plex_search:
      sort_by: album_artist.asc
      any:
        album_label:
          - "musical"
        album_genre:
          - "Musical"

  "Live Albums":
    summary: ""
    builder_level: album
    template:
      name: collection_not_visible
      poster: coll-live
    plex_search:
      sort_by: album_artist.asc
      any:
        album_label:
          - "live"
        album_type:
          - "Live"
        album_title:
          - "live"
