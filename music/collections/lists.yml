#############################################################################
#####
##### External list collections
#####
#############################################################################
external_templates:
  - repo: music/templates/music_collections

collections:
  ### personal collections
  "📀Physical Media":
    summary: ""
    sort_title: "__+Physical Media"
    builder_level: album
    template:
      name: collection_not_visible
      poster: coll-vinyl
    plex_search:
      sort_by: album_artist.asc
      any:
        album_label:
          - "vinyl"
          - "cd"

  "Vinyl Collection":
    summary: "You spin me right round baby, right round"
    sort_title: "__+Physical Media: Vinyl"
    builder_level: album
    template:
      name: collection_not_visible
      poster: coll-vinyl
    plex_search:
      sort_by: album_artist.asc
      album_label:
        - "vinyl"

  "CD Collection":
    summary: "The future is now old man!"
    sort_title: "__+Physical Media: CD"
    builder_level: album
    template:
      name: collection_not_visible
      poster: coll-cd
    plex_search:
      sort_by: album_artist.asc
      album_label:
        - "cd"

  "Musicals":
    summary: ""
    builder_level: album
    template:
      name: collection_not_visible
      poster: coll-musicals
    plex_search:
      sort_by: album_artist.asc
      any:
        album_label:
          - "musical"
        album_genre:
          - "Musical"
