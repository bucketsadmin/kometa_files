#############################################################################
#####
##### External list collections
#####
#############################################################################
external_templates:
  - repo: music/templates/music_collections

collections:
  ### personal collections
  "Physical Collection":
    summary: ""
    sort_title: "__+Physical Media"
    template:
      name: Collection
      poster: coll-vinyl
    plex_search:
      sort_by: album_artist.asc
      any:
        album_label:
          - "vinyl"
          - "cd"

  "Vinyl Collection":
    summary: "You spin me right round baby, right round"
    sort_title: "__+Physical Media: Vinyl"
    template:
      name: Collection
      poster: coll-vinyl
    plex_search:
      sort_by: album_artist.asc
      album_label:
        - "vinyl"

  "CD Collection":
    summary: "The future is now old man!"
    sort_title: "__+Physical Media: CD"
    template:
      name: Collection
      poster: coll-cd
    plex_search:
      sort_by: album_artist.asc
      album_label:
        - "cd"
