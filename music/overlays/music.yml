#############################################################################
#####
##### media overlays
#####
#############################################################################

##### currently utilized labels:
# - "cd"
# - "vinyl"
# - "bandcamp"
# - "apple-music"
# - "itunes"
#

overlays:
  apple_overlay:
    builder_level: album
    overlay:
      name: apple_music_collection
      file: /assets/overlays/apple-music-overlay.png
    plex_search:
      all:
        album_label:
          - "apple-music"
        album_label.not:
          - "vinyl"
          - "cd"

  itunes_overlay:
    builder_level: album
    overlay:
      name: itunes_collection
      file: /assets/overlays/itunes-overlay.png
    plex_search:
      all:
        album_label:
          - "itunes"
        album_label.not:
          - "vinyl"
          - "cd"

  bandcamp_overlay:
    builder_level: album
    overlay:
      name: bandcamp_collection
      file: /assets/overlays/bandcamp-overlay.png
    plex_search:
      all:
        album_label:
          - "bandcamp"
        album_label.not:
          - "vinyl"
          - "cd"

  cd_overlay:
    builder_level: album
    overlay:
      name: cd_collection
      file: /assets/overlays/cd-overlay.png
    plex_search:
      all:
        album_label:
          - "cd"
        album_label.not:
          - "vinyl"

  vinyl_overlay:
    builder_level: album
    overlay:
      name: vinyl_collection
      file: /assets/overlays/vinyl-overlay.png
    plex_search:
      all:
        album_label:
          - "vinyl"
