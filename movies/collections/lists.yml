  ### TMDB keywords
  "Marvel Cinematic Universe":
    tmdb_keyword: 180547
    summary: "The Marvel Cinematic Universe (MCU) is vast, incredibly varied, and richly complex, with different worlds, different timelines, and countless characters."
    template:
      name: Collection
      poster: coll-mcu
    visible_shared: true

  #Special Collections
  "🎄Christmas 🎄":
    mdblist_list:
      url: https://mdblist.com/lists/n0t4u2c/complete-christmas-collection
    summary: "Christmas time is here..."
    sync_mode: append #(2!)
    collection_order: custom
    schedule: range(11/25-01/07)
    visible_home: range(11/25-01/07)
    visible_shared: range(11/25-01/07)
    delete_not_scheduled: true
    sort_title: "__++Christmas"
    template:
      name: collection_no_schedule

  ## Custom Collections

  "📀Physical Media":
    summary: "Here you will find media that I have physical copies of in my home.\n\nA Collection for Movies that I have physical copies of. Whether Blu-Ray or DVD, these discs give me permanent access to always share these movies.\n\nSo view this collection as my way of \"sharing\" my physical copy with you, over the internet."
    tmdb_list:
      - https://www.themoviedb.org/list/8539683-blu-ray-collection
      - https://www.themoviedb.org/list/8578249-dvd-collection
      - https://www.themoviedb.org/list/8641678-ultra-hd
    sort_title: "__+Physical Media"
    visible_shared: true
    smart_label:
      sort_by: title.asc
      all:
        label: <<smart_label>>
    template:
      name: smart_no_schedule
      poster: coll-default

  "Top 10":
    sort_title: "__+Top-10"
    summary: "My favorite movies of all time"
    template:
      name: smart_collection
      poster: coll-top
    collection_order: custom
    limit: 10
    smart_filter:
      validate: true
      any:
        title.is:
          - "Star Trek II: The Wrath of Khan"
          - "Star Trek: First Contact"
          - "Young Frankenstein"
          - "Blazing Saddles"
          - "Hot Fuzz"
          - "Monty Python and the Holy Grail"
          - "The Muppet Christmas Carol"
          - "Ghostbusters"
          - "Clue"
          - "Airplane!"

  ################# Studio Collections

  "Walt Disney":
    template:
      {
        name: Studio,
        studio: ["Walt Disney", "Walt Disney Pictures", "Walt Disney Productions", "Walt Disney Animation Studios", "Walt Disney Feature Animation"],
        poster: coll-disney,
      }
    summary: "Walt Disney Studios"
    visible_library: false
    visible_home: false
    visible_shared: true
