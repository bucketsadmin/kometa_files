################# mdblist Collections
  "The Criterion Collection":
    mdblist_list:
      url: https://mdblist.com/lists/pizzadeath/the-criterion-collection
    summary: >-
      "Since 1984, the Criterion Collection has been dedicated to publishing important classic and contemporary films 
      from around the world in editions that offer the highest technical quality and award-winning, original supplements. 
      No matter the medium—from laserdisc to DVD, Blu-ray, 4K Ultra HD to streaming
      Criterion has maintained its pioneering commitment to presenting each film as its maker would want it seen, 
      in state-of-the-art restorations with special features designed to encourage repeated watching and deepen 
      the viewer’s appreciation of the art of film."
    sync_mode: sync
    collection_order: custom
    sort_title: "Criterion Collection"
    template:
      name: Collection
      poster: coll-criterion
    visible_shared: true

