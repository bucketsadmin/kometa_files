  ################# Custom Collections

  "📀Physical Media":
    summary: >-
      "Here you will find media that I have physical copies of in my home.\n\n
      A Collection for Movies that I have physical copies of. 
      Whether Blu-Ray or DVD, these discs give me permanent access to always share these movies.\n\n
      So view this collection as my way of \"sharing\" my physical copy with you, over the internet."
    tmdb_list:
      - https://www.themoviedb.org/list/8539683-blu-ray-collection
      - https://www.themoviedb.org/list/8578249-dvd-collection
      - https://www.themoviedb.org/list/8641678-ultra-hd
    sort_title: "__+Physical Media"
    visible_shared: true
    smart_label:
      sort_by: title.asc
      all:
        label: <<smart_label>>
    template:
      name: smart_no_schedule
      poster: coll-default

  "Top 10":
    sort_title: "__+Top-10"
    summary: "My favorite movies of all time"
    template:
      name: smart_collection
      poster: coll-top
    limit: 10
    smart_filter:
      validate: true
      any:
        title.is:
          - "Star Trek II: The Wrath of Khan"
          - "Star Trek: First Contact"
          - "Young Frankenstein"
          - "Blazing Saddles"
          - "Hot Fuzz"
          - "Monty Python and the Holy Grail"
          - "The Muppet Christmas Carol"
          - "Ghostbusters"
          - "Clue"
          - "Airplane!"

