  Rogue One:
    match:
      title: Rogue One the Andor Cut
    title: "Rogue One"
    sort_title: rogue one the andor cut
    edition: The Andor Cut
    originally_available: 2026-05-25
    genre: [Action, Adventure, Science Fiction]
    writer: [John Knoll, Chris Weitz, Gary Whitta, George Lucas, Tony Gilroy]
    producer: [Simon Emanuel, Kathleen Kennedy, Allison Shearmur, Leifur B. Dagfinnsson]
    content_rating: PG-13
    studio: Lucasfilm Ltd.
    director: Gareth Edwards
    country: United States of America
    label: [fan_edit]
    tagline: "Welcome to the rebellion, and witness the end of the andor saga."
    summary: >-
      "Re-watch ROGUE ONE like you've never seen it before. 
      This reimagining of the 2016 film sets out to re-envision 'Rogue One: A Star Wars Story'
      as the finale and epilogue to the 'ANDOR series, as if it had been made after the conclusion of its two seasons. 
      Musical themes and leitmotifs from the show are present, pertinent flashbacks are inserted, 
      and the tone is shifted to be more in line with what was conveyed in the 24-episode epic."
