overlays:
  #### tmdb lists
  digital_overlay:
    overlay:
      name: digital_collection
      file: /assets/overlays/digital.png
    plex_search:
      all:
        label:
          - "💽Digital Media"
        label.not:
          - "📀Physical Media: DVD"
          - "📀Physical Media: Blu-Ray"
          - "📀Physical Media: Ultra HD"


  dvd_overlay:
    overlay:
      name: dvd_collection
      file: /assets/overlays/dvd.png
    plex_search:
      all:
        label:
          - "📀Physical Media: DVD"
        label.not:
          - "📀Physical Media: Blu-Ray"
          - "📀Physical Media: Ultra HD"

  blu_ray:
    overlay:
      name: blu_ray
      file: /assets/overlays/blu-ray.png
    plex_search:
      all:
        label:
          - "📀Physical Media: Blu-Ray"
        label.not:
          - "📀Physical Media: Ultra HD"

  ultra_high_def:
    overlay:
      name: ultra_high_def
      file: /assets/overlays/ultra-blu-ray.png
    plex_search:
      all:
        label:
          - "📀Physical Media: Ultra HD"

  #### manual configs
  horrible:
    overlay:
      name: blu_ray
      file: /assets/overlays/blu-ray.png
    plex_search:
      any:
        title.is:
          - "Dr. Horrible's Sing-Along Blog"

  little_shop:
    overlay:
      name: blu_ray
      file: /assets/overlays/blu-ray.png
    plex_search:
      all:
        title.is:
          - "little shop of horrors"
        edition.is:
          - "Director's Cut"
