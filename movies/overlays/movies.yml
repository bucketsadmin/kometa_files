overlays:
  #### tmdb lists
  youtube_overlay:
    overlay:
      name: youtube_collection
      file: /assets/overlays/youtube-overlay.png
    plex_search:
      all:
        label:
          - "youtube"

  dvd_overlay:
    overlay:
      name: dvd_collection
      file: /assets/overlays/dvd.png
    plex_search:
      all:
        label:
          - "DVD"
        label.not:
          - "Blu-Ray"
          - "Ultra HD"

  blu_ray: #only catch discs that are blu-ray, no other mediums
    overlay:
      name: blu_ray
      file: /assets/overlays/blu-ray.png
    plex_search:
      all:
        label:
          - "Blu-Ray"
        label.not:
          - "Ultra-HD"
          - "dvd"

  ultra_high_def:
    overlay:
      name: ultra_high_def
      file: /assets/overlays/ultra-blu-ray.png
    plex_search:
      all:
        label:
          - "Ultra-HD"

  #### manual configs
  horrible:
    overlay:
      name: blu_ray
      file: /assets/overlays/blu-ray.png
    plex_search:
      any:
        title.is:
          - "Dr. Horrible's Sing-Along Blog"

  little_shop:
    overlay:
      name: blu_ray
      file: /assets/overlays/blu-ray.png
    plex_search:
      all:
        title.is:
          - "little shop of horrors"
        edition.is:
          - "Director's Cut"
