      title: Star Trek Picard
    seasons:
      0:
        summary:
          "Over twenty years after the evens of Star Trek: Nemesis (2002), retired Starfleet Admiral Jean-Luc Picard
           receives a mysterious transmission from Dr. Beverly Crusher, telling him to trust no one.
           Picard and former enterprise first officer, William Riker, devise a plan to rescue Dr. Crusher from peril,
           and in the process unravel a widespread conspiracy that threatens the entire Federation.
           They must get the band back together, reuniting members of the old crew for one final mission
           to save the galaxy, in this enthralling techno-thriller that showrunner Terry Matalas calls,
           \"the last 'Next Generation' movie that we never got.\"
           \n
           The edit of this swan-song combines al 10 episodes of Star Trek Picard's final season into 3
           feature-length films:
           Part I: \"The Next Generation\", 
           Part II: \"Surrender\", 
           Part III: \"The Last Generation\"
           \n
           Witness the grand finale of \"The Next Generation,\" in this 3-film edit of Star Trek: Picard, Season 3.
          "
