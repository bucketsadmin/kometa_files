  #### MCU
  "MCU Phase 4":
    sync_mode: sync
    template:
      name: show_collection
      poster: coll-phase-04.png
    collection_order: release
    sort_title: Marvel_MCU Phase 4
    summary: >-
      "Phase 4 introduces both the The Blip recovery era and the introduction of the Multiverse, beginning the Multiverse saga.
      
      The Blip recovery era covers the MCU titles set in the immediate aftermath of Avengers: Endgame — 
      primarily the Disney+ series launched from 2021 onward. WandaVision, The Falcon and the Winter Soldier, Loki, 
      Hawkeye, Moon Knight, Ms. Marvel, and She-Hulk: Attorney at Law all deal, in different ways, 
      with what it means to live in a world that lost half its population for five years and then got it back. 
      The emotional register of this era is explicitly grief-inflected.
      
       The Disney+ expansion of Phase 4 represents the franchise's most ambitious structural experiment: 
      treating television as a continuation of the theatrical narrative rather than supplementary spin-off content. 
      WandaVision, in particular, earns its place in any discussion of the MCU's best work — a formally inventive 
      miniseries that uses the history of American sitcoms as a grief metaphor and lands its emotional 
      conclusion with genuine force. For the Blip era to work, prior Infinity War and Endgame familiarity is essential: 
      this phase is explicitly about aftermath.
      
      
       The Multiverse opening phase marks the MCU's transition from the Infinity Saga's closed-universe storytelling
      to the open, parallel-reality architecture of the Multiverse Saga. Black Widow, Shang-Chi, Eternals, 
      Spider-Man: No Way Home, Doctor Strange in the Multiverse of Madness, Thor: Love and Thunder, Black Panther: 
      Wakanda Forever, and Ant-Man and the Wasp: Quantumania collectively establish the new cosmological rules while 
      introducing the franchise's next generation of heroes.
      
       Spider-Man: No Way Home is the phase's most significant theatrical event: the multiverse opening that allows
      three generations of Spider-Man to coexist, resolves Peter Parker's MCU arc definitively, and functions as 
      both a crowd-pleasing reunion and a genuine farewell. Doctor Strange in the Multiverse of Madness then takes 
      the multiverse seriously as a threat rather than a toy. The phase is uneven — Eternals in particular is divisive
      — but the multiverse infrastructure it establishes is load-bearing for everything that follows in Phases 5 and 6.
       "
    floppy_list:
      - url: https://lists.jjsimpson.xyz/list/12

  "MCU Phase 5":
    template:
      name: show_collection
      poster: coll-phase-05.png
    sort_title: Marvel_MCU Phase 5
    summary: >-
      "Phase 5 is the Multiverse War in earnest: the period in which the threat of Kang 
      and the fragmentation of the multiverse become structurally unavoidable. 
      Guardians of the Galaxy Vol. 3, Loki Season 2, Echo, Ironheart, Agatha All Along, 
      Daredevil: Born Again, and Captain America: Brave New World collectively position the heroes 
      of the incoming Doomsday era while resolving outstanding character arcs from earlier phases.
      
      Loki Season 2's finale is Phase 5's most consequential narrative event: 
      Loki's sacrifice at the end of time restructures the multiverse's architecture and sets the 
      conditions for everything that follows in Phase 6. Guardians of the Galaxy Vol. 3 closes that 
      ensemble's story definitively. Daredevil: Born Again reintegrates Charlie Cox's Matt Murdock 
      into the theatrical MCU. Phase 5 is essential preparation for Avengers: Doomsday — it populates 
      the final battle with characters whose histories matter, and establishes the specific multiverse 
      mechanics that Doomsday will exploit."
    floppy_list:
      - url: https://lists.jjsimpson.xyz/list/13

  "MCU Phase 6":
    template:
      name: show_collection
      poster: coll-phase-06.png
    sort_title: Marvel_MCU Phase 6
    summary: >-
      "Phase 6 is the Multiverse Saga's endgame — the period leading to and immediately following 
      Avengers: Doomsday (2026), the franchise's largest assembled cast event since Endgame. 
      The phase brings together heroes from the MCU main timeline, the Fox X-Men universe, 
      and multiple alternate realities to confront Doctor Doom and whatever the fractured 
      multiverse has made possible.
      
      Avengers: Doomsday is positioned as the resolution of every narrative thread seeded across Phases 4 and 5. 
      Robert Downey Jr.'s return as Victor Von Doom — rather than Tony Stark — is the phase's central creative statement: 
      the actor who defined the MCU's opening era returning in an entirely different register, 
      playing a character whose philosophy is the inverse of Tony Stark's. Phase 6 is where the 
      multiverse experiment concludes. Every essential film and series across the Multiverse Saga is preparation for this payoff."
    floppy_list:
      - url: https://lists.jjsimpson.xyz/list/14

