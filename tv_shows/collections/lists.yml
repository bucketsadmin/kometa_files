#############################################################################
#####
##### External list collections
#####
#############################################################################
external_templates:
  - repo: tv_shows/templates/tv_collections

### yamtrack collections should be kept in the local config

collections:
  ### Marvel Collections
  "Marvel Cinematic Universe":
    sync_mode: sync
    template:
      name: show_collection
      poster: coll-mcu.png
    collection_order: release
    sort_title: Marvel_MCU
    visible_shared: true
    tmdb_keyword: 180547

  ## tmdb lists
  "📀Physical Media":
    summary: "Here you will find media that I have physical copies of in my home.\n\nA Collection for TV Shows that I have physical copies of. Whether Blu-Ray or DVD, gives me permanent access to always share these shows.\n\nSo view this collection as my way of \"sharing\" my physical copy with you, over the internet."
    tmdb_list:
      - https://www.themoviedb.org/list/8539683-blu-ray-collection
      - https://www.themoviedb.org/list/8578249-dvd-collection
    sort_title: "__+Physical Media"
    visible_shared: true
    smart_label:
      sort_by: release.desc
      all:
        label: <<smart_label>>
    template:
      name: show_collection
      poster: coll-default.png

  "Star Trek Collection":
    template:
      name: Collection
      poster: coll-trek
    summary: "Space: the final frontier. These are the voyages of the starship Enterprise. Its continuing mission: to explore strange new worlds, to seek out new life and new civilizations, to boldly go where no man has gone before."
    visible_shared: true
    tmdb_list:
      - https://www.themoviedb.org/list/8634450-star-trek

  "Weird Shows":
    summary: "There's just something a little off about these shows"
    visible_shared: true
    tmdb_list:
      - https://www.themoviedb.org/list/8539896-weird-shows
    template:
      name: Collection
      poster: coll-weird

  ### TMDB Directors
  Ken Burns:
    template:
      name: tmdb_director
      tmdb: 204484
      poster: coll-ken-burns
